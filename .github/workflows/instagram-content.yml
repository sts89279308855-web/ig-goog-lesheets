name: Instagram content replenishment
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      max_generate:
        description: Maximum new videos in this run (1–3)
        type: choice
        default: '2'
        options: ['1', '2', '3']
permissions:
  contents: write
concurrency:
  group: instagram-content-generator
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      MAX_GENERATE: ${{ inputs.max_generate || '2' }}
    steps:
      - name: Download pinned source and approved presenter
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p scripts assets
          for FILE in cloud_publish_test.py cloud_pipeline.py cloud_render.py; do
            curl -fsSL "https://raw.githubusercontent.com/$REPO/$COMMIT/scripts/$FILE" -o "scripts/$FILE"
          done
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$COMMIT/content-bank.json" -o content-bank.json
          curl -fsSL "https://raw.githubusercontent.com/$REPO/$COMMIT/assets/author-presenter.jpg" -o assets/author-presenter.jpg
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m pip install --quiet 'Pillow>=11,<13' 'edge-tts>=7,<8' 'imageio-ffmpeg==0.6.0'
          python3 -m pip freeze
      - name: Verify all template layouts
        run: python3 scripts/cloud_pipeline.py self-test
      - name: Replenish eight-day queue
        run: python3 -u scripts/cloud_pipeline.py generate
